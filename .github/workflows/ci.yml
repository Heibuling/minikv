name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov hypothesis ruff mypy
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy          # strict; configured in pyproject.toml
      - name: Tests with coverage
        run: pytest --cov=minikv --cov-report=term-missing
        # the coverage floor lives in pyproject.toml (fail_under = 85)
      - name: Install as a package
        run: python -m pip install .
      - name: Import without third-party packages
        run: python -c "import minikv; print(minikv.__version__)"
