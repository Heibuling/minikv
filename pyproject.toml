[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minikv"
version = "1.1.0"
description = "A small, auditable LSM-style embedded key-value store (standard library only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "minikv contributors" }]
keywords = ["lsm", "key-value", "storage-engine", "embedded", "wal", "sstable"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "hypothesis>=6"]

[project.scripts]
minikv = "minikv.cli:main"

[tool.setuptools.packages.find]
include = ["minikv*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: end-to-end crash and concurrency tests"]

[tool.coverage.run]
source = ["minikv"]
branch = true

[tool.coverage.report]
# Measured at 89% on the development machine.  The floor only guards
# against a change that adds code without tests; it is not a target.
fail_under = 85
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
